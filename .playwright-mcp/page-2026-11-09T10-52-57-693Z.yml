      - generic [ref=f4e29]: The Studio · Story & Vision
      - heading "We craft interiors that speak in silence." [level=1] [ref=f4e32]
      - paragraph [ref=f4e33]: Founded in Dubai in 2018, VELQON is an architectural interior design atelier devoted to the principles of proportion, shadow, and uncompromised materiality.
    - generic [ref=f4e36]:
      - generic [ref=f4e38]:
