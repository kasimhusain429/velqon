        - generic [ref=f4e45]:
          - text: Our Background
          - heading "Rejecting superficial trends in favor of enduring architectural calm." [level=2] [ref=f4e46]
        - generic [ref=f4e47]:
          - paragraph [ref=f4e48]: VELQON was founded to challenge the saturated, glittery aesthetic that often defines modern development. We recognized that true global collectors and tastemakers long for sanctuaries—homes where the mind can decelerate and find stillness.
          - paragraph [ref=f4e49]: Every commission begins with a study of light. We map how the desert sun travels across your spatial footprint, positioning monolithic stone elements, micro-textured lime plaster, and acoustic timber joinery so that the home transforms organically throughout the day.
          - paragraph [ref=f4e50]: With in-house master joinery ateliers and direct supply partnerships with historic stone quarries in Tivoli and Carrara, we maintain end-to-end quality control from the raw mineral block to final white-glove styling.
        - generic [ref=f4e51]:
          - generic [ref=f4e52]:
            - generic [ref=f4e53]: Proportion
            - paragraph [ref=f4e58]: Golden ratio alignments and generous ceiling clearances that induce immediate calm.
          - generic [ref=f4e59]:
            - generic [ref=f4e60]: Authenticity
            - paragraph [ref=f4e64]: "Real materials that patinate beautifully over decades: stone, unlacquered bronze, and linen."
          - generic [ref=f4e65]:
            - generic [ref=f4e66]: Precision
            - paragraph [ref=f4e71]: 0.5mm joinery tolerances and zero-gap architectural flush trims throughout.
