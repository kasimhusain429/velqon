    - generic [ref=f6e55]:
      - paragraph [ref=f6e56]: Positioned along the pristine fronds of Palm Jumeirah, Residence Noir is a bespoke architectural renovation translating charcoal materiality into a warm sanctuary of quiet luxury.
      - paragraph [ref=f6e57]: We stripped away ornate embellishments to reveal pure rectilinear geometry. Honed travertine flooring continues from the foyer right out to the infinity pool coping, dissolving boundaries between indoors and the Arabian Gulf.
